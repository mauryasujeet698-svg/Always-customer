name: allways_app
description: ALLways Android app - shared Firebase backend with the ALLways website.
publish_to: "none"
version: 1.5.4
environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.2.10
  google_sign_in: ^7.1.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  share_plus: ^11.0.0
  http: ^1.5.0
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  speech_to_text: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

