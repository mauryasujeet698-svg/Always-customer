      - name: Prepare APK Release Asset
        run: |
          mkdir -p release-assets
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-v${APP_VERSION}.apk"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-latest.apk"

      - name: Upload APK (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allways-release-apk-v${{ env.APP_VERSION }}
          path: release-assets/allways-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 1


      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/allways-android-app'
        with:
          tag_name: allways-latest
          name: "ALLways Android v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: |
            release-assets/allways-v${{ env.APP_VERSION }}.apk
            release-assets/allways-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
