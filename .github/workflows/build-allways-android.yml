# ALLways native Android customer-app build.
# The Flutter source of truth for the native APK is the allways-android-app branch.
# The website/main branch is a separate web deployment and is intentionally not an APK trigger.
name: Build ALLways Android APK

on:
  push:
    branches:
      - allways-android-app
    paths:
      - "mobile/**"
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/build-allways-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      # The owner self-hosted runner is a Windows desktop. Existing build steps
      # intentionally remain Bash scripts; put Git for Windows' Bash on PATH
      # before any step that uses the job-level Bash shell.
      - name: Locate Bash on self-hosted Windows runner
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $candidates = @(
            "$env:ProgramFiles\Git\bin",
            "$env:ProgramFiles\Git\usr\bin",
            "$env:LOCALAPPDATA\Programs\Git\bin"
          )
          $bashDirectory = $candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ 'bash.exe')) } | Select-Object -First 1
          if (-not $bashDirectory) {
            Write-Error "Git Bash was not found in the standard Git for Windows locations. Install Git for Windows with Bash, then restart the GitHub Actions runner service."
            exit 1
          }
          Write-Host "Using Git Bash from $bashDirectory"
          Add-Content -Path $env:GITHUB_PATH -Value $bashDirectory
      - name: Diagnose self-hosted runner
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS: ${RUNNER_OS:-unknown} / ${RUNNER_ARCH:-unknown}"
          echo "Workspace: ${GITHUB_WORKSPACE:-unknown}"
          echo "JAVA_HOME: ${JAVA_HOME:-not-set}"
          echo "ANDROID_HOME: ${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-not-set}"
          command -v bash
          command -v python3 || command -v python
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe existing Flutter SDK
        id: flutter_probe
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $candidateBins = @()
          if ($env:FLUTTER_ROOT) { $candidateBins += (Join-Path $env:FLUTTER_ROOT 'bin') }
          if ($env:USERPROFILE) {
            $candidateBins += (Join-Path $env:USERPROFILE 'flutter\bin')
            $candidateBins += (Join-Path $env:USERPROFILE 'development\flutter\bin')
            $candidateBins += (Join-Path $env:USERPROFILE 'developer-tools\flutter-3.35.2\flutter\bin')
          }
          if ($env:LOCALAPPDATA) { $candidateBins += (Join-Path $env:LOCALAPPDATA 'Programs\Flutter\bin') }
          if ($env:ProgramFiles) { $candidateBins += (Join-Path $env:ProgramFiles 'flutter\bin') }
          if ($env:RUNNER_TOOL_CACHE) {
            $candidateBins += (Join-Path $env:RUNNER_TOOL_CACHE 'flutter\stable-3.35.2\bin')
            $candidateBins += (Join-Path $env:RUNNER_TOOL_CACHE 'flutter\3.35.2\bin')
          }
          $existing = Get-Command flutter.bat -ErrorAction SilentlyContinue
          if ($existing -and $existing.Source) { $candidateBins += (Split-Path -Parent $existing.Source) }
          $flutterBin = $candidateBins | Where-Object { $_ -and (Test-Path (Join-Path $_ 'flutter.bat')) } | Select-Object -First 1
          if ($flutterBin) {
            Write-Host "Reusing Flutter SDK from $flutterBin"
            & (Join-Path $flutterBin 'flutter.bat') --version
            if ($LASTEXITCODE -ne 0) { throw "The Flutter SDK found at $flutterBin could not run." }
            Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
            Add-Content -Path $env:GITHUB_ENV -Value ("FLUTTER_ROOT=" + (Split-Path -Parent $flutterBin))
            Add-Content -Path $env:GITHUB_OUTPUT -Value "installed=true"
          } else {
            Write-Host "No reusable Flutter SDK found. Paths checked:"
            $candidateBins | ForEach-Object { Write-Host (" - " + $_) }
            Add-Content -Path $env:GITHUB_OUTPUT -Value "installed=false"
          }
      - name: Set up Flutter
        id: flutter_action
        if: steps.flutter_probe.outputs.installed != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Bootstrap pinned Flutter SDK if setup action fails
        if: steps.flutter_probe.outputs.installed != 'true' && steps.flutter_action.outcome == 'failure'
        timeout-minutes: 90
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.35.2'
          $expectedSha256 = '85060320e2aadbfd33122157c4186a143971af6384c78b1e5537b5ef038a1738'
          $sdkHome = Join-Path $env:USERPROFILE ('developer-tools\flutter-' + $version)
          $sdkBin = Join-Path $sdkHome 'flutter\bin'
          $flutterBat = Join-Path $sdkBin 'flutter.bat'
          if (Test-Path $flutterBat) {
            Write-Host "Using existing pinned Flutter SDK at $sdkBin"
            Add-Content -Path $env:GITHUB_PATH -Value $sdkBin
            Add-Content -Path $env:GITHUB_ENV -Value ("FLUTTER_ROOT=" + (Join-Path $sdkHome 'flutter'))
            & $flutterBat --version
            if ($LASTEXITCODE -ne 0) { throw 'Cached Flutter SDK did not run successfully.' }
            exit 0
          }
          $driveLetter = $env:USERPROFILE.Substring(0,1)
          $drive = Get-PSDrive -Name $driveLetter
          if (-not $drive -or $drive.Free -lt 6GB) {
            $free = if ($drive) { [math]::Round($drive.Free / 1GB, 2) } else { 'unknown' }
            throw "Flutter SDK bootstrap needs at least 6 GiB free on drive $driveLetter. Available: $free GiB."
          }
          $archive = Join-Path $env:RUNNER_TEMP ('flutter_windows_' + $version + '-stable.zip')
          $url = 'https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_' + $version + '-stable.zip'
          New-Item -ItemType Directory -Force -Path $sdkHome | Out-Null
          Write-Host "Downloading pinned Flutter $version archive from the official Flutter release host."
          & curl.exe --location --fail --retry 3 --retry-delay 5 --connect-timeout 30 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "Flutter archive download failed with curl exit code $LASTEXITCODE." }
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -Force -ErrorAction SilentlyContinue $archive
            throw "Flutter archive SHA-256 mismatch; expected $expectedSha256, got $actualSha256."
          }
          Write-Host 'Flutter archive SHA-256 verified.'
          Expand-Archive -LiteralPath $archive -DestinationPath $sdkHome -Force
          if (-not (Test-Path $flutterBat)) { throw "Flutter SDK extraction completed but $flutterBat was not found." }
          Add-Content -Path $env:GITHUB_PATH -Value $sdkBin
          Add-Content -Path $env:GITHUB_ENV -Value ("FLUTTER_ROOT=" + (Join-Path $sdkHome 'flutter'))
          & $flutterBat --version
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrapped Flutter SDK could not execute.' }
          Remove-Item -Force -ErrorAction SilentlyContinue $archive

      - name: Verify Flutter SDK
        run: |
          command -v flutter || command -v flutter.bat
          flutter --version
          dart --version

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure permanent Android project exists
        run: |
          cd mobile
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            mkdir -p /tmp/allways-bootstrap
            if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/allways-bootstrap/google-services.json; fi
            flutter create . --platforms=android --org com.allways.app
            if [ -f /tmp/allways-bootstrap/google-services.json ]; then
              mkdir -p android/app
              cp /tmp/allways-bootstrap/google-services.json android/app/google-services.json
            fi
          fi
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          import re
          target="com.allways.app"
          root=Path("android/app/src/main")
          candidates=list((root/"kotlin").rglob("MainActivity.kt"))+list((root/"java").rglob("MainActivity.java"))
          if not candidates: raise SystemExit("MainActivity not found")
          src=candidates[0]
          text=re.sub(r'^package\s+[^\n]+',f'package {target}',src.read_text(),count=1,flags=re.M)
          target_dir=root/"kotlin"/"com"/"allways"/"app"
          if src.suffix==".java": target_dir=root/"java"/"com"/"allways"/"app"
          target_dir.mkdir(parents=True,exist_ok=True)
          dst=target_dir/src.name
          dst.write_text(text)
          if src.resolve()!=dst.resolve(): src.unlink()
          PY

      - name: Configure native PackageInstaller updater
        run: |
          cd mobile
          mkdir -p android/app/src/main/kotlin/com/allways/app
          cat > android/app/src/main/kotlin/com/allways/app/MainActivity.kt <<'EOF'
          package com.allways.app
          
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageInstaller
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream
          
          class MainActivity : FlutterActivity() {
              private val updaterChannel = "com.allways.app/apk_installer"
              private val installAction = "com.allways.app.PACKAGE_INSTALL_STATUS"
              private val notificationChannelId = "allways_updates"

              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  super.onCreate(savedInstanceState)
                  createNotificationChannel()
              }
          
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, updaterChannel)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "showNotification" -> {
                                  showLocalNotification(call.argument<String>("title") ?: "ALLways", call.argument<String>("body") ?: "New update")
                                  result.success("shown")
                              }
                              "createNotificationChannel" -> {
                                  createNotificationChannel()
                                  result.success("created")
                              }
                              "installApk" -> installApk(call.argument<String>("path"), result)
                              "openInstallSettings" -> {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                                  } else {
                                      startActivity(Intent(Settings.ACTION_SECURITY_SETTINGS))
                                  }
                                  result.success("opened")
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(
                          NotificationChannel(notificationChannelId, "ALLways Updates", NotificationManager.IMPORTANCE_HIGH).apply {
                              description = "Order, delivery and ALLways alerts"
                              enableVibration(true)
                          }
                      )
                  }
              }

              private fun showLocalNotification(title: String, body: String) {
                  createNotificationChannel()
                  val launchIntent = packageManager.getLaunchIntentForPackage(packageName)?.apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pending = launchIntent?.let {
                      PendingIntent.getActivity(
                          this,
                          (System.currentTimeMillis() and 0x7fffffff).toInt(),
                          it,
                          PendingIntent.FLAG_UPDATE_CURRENT or if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0
                      )
                  }
                  val notification = NotificationCompat.Builder(this, notificationChannelId)
                      .setSmallIcon(R.drawable.ic_stat_allways_notification)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setContentIntent(pending)
                      .build()
                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                      .notify((System.currentTimeMillis() and 0x7fffffff).toInt(), notification)
              }

              private fun installApk(path: String?, result: MethodChannel.Result) {
                  if (path.isNullOrBlank()) {
                      result.error("NO_APK", "APK path is missing", null)
                      return
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                          !packageManager.canRequestPackageInstalls()) {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:$packageName")
                              )
                          )
                          result.success("permission_required")
                          return
                      }
                      val apk = File(path)
                      if (!apk.exists() || !apk.isFile || !apk.canRead() || apk.length() <= 0L) {
                          result.error("NO_APK", "Downloaded APK is missing or unreadable", null)
                          return
                      }
          
                      val installer = packageManager.packageInstaller
                      val params = PackageInstaller.SessionParams(
                          PackageInstaller.SessionParams.MODE_FULL_INSTALL
                      )
                      params.setAppPackageName(packageName)
                      params.setAppLabel("ALLways")
          
                      val sessionId = installer.createSession(params)
                      val session = installer.openSession(sessionId)
                      try {
                          session.openWrite("package", 0, apk.length()).use { output ->
                              FileInputStream(apk).use { input ->
                                  input.copyTo(output, 1024 * 1024)
                              }
                              session.fsync(output)
                          }
          
                          val statusIntent = Intent(this, InstallStatusReceiver::class.java).apply {
                              action = installAction
                              putExtra("sessionId", sessionId)
                          }
          
                          val flags =
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                              } else {
                                  PendingIntent.FLAG_UPDATE_CURRENT
                              }
          
                          session.commit(
                              PendingIntent.getBroadcast(
                                  this,
                                  sessionId,
                                  statusIntent,
                                  flags
                              ).intentSender
                          )
                          result.success("started")
                      } catch (e: Exception) {
                          try { session.abandon() } catch (_: Exception) {}
                          throw e
                      } finally {
                          try { session.close() } catch (_: Exception) {}
                      }
                  } catch (e: Exception) {
                      result.error(
                          "INSTALL_FAILED",
                          e.message ?: "Package installation failed",
                          null
                      )
                  }
              }
          
              class InstallStatusReceiver : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (
                          intent.getIntExtra(
                              PackageInstaller.EXTRA_STATUS,
                              PackageInstaller.STATUS_FAILURE
                          ) == PackageInstaller.STATUS_PENDING_USER_ACTION
                      ) {
                          val confirmIntent =
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  intent.getParcelableExtra(
                                      Intent.EXTRA_INTENT,
                                      Intent::class.java
                                  )
                              } else {
                                  @Suppress("DEPRECATION")
                                  intent.getParcelableExtra(Intent.EXTRA_INTENT)
                              }
          
                          if (confirmIntent != null) {
                              confirmIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              context.startActivity(confirmIntent)
                          }
                      }
                  }
              }
          }
          
          EOF
          cat > android/app/src/main/kotlin/com/allways/app/AllwaysFirebaseMessagingService.kt <<'EOF'
          package com.allways.app

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import com.google.firebase.messaging.FirebaseMessagingService
          import com.google.firebase.messaging.RemoteMessage

          class AllwaysFirebaseMessagingService : FirebaseMessagingService() {
              override fun onMessageReceived(message: RemoteMessage) {
                  val title = message.notification?.title ?: message.data["title"] ?: "ALLways"
                  val body = message.notification?.body ?: message.data["body"] ?: message.data["message"] ?: "You have a new ALLways update."
                  val channelId = "allways_updates"
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      manager.createNotificationChannel(NotificationChannel(channelId, "ALLways Updates", NotificationManager.IMPORTANCE_HIGH))
                  }
                  val launchIntent = packageManager.getLaunchIntentForPackage(packageName)?.apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pending = launchIntent?.let {
                      PendingIntent.getActivity(this, (System.currentTimeMillis() and 0x7fffffff).toInt(), it,
                          PendingIntent.FLAG_UPDATE_CURRENT or if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(R.drawable.ic_stat_allways_notification)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setContentIntent(pending)
                      .build()
                  manager.notify((System.currentTimeMillis() and 0x7fffffff).toInt(), notification)
              }
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          import re
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          s=manifest.read_text()
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              m=re.search(r"<manifest[^>]*>",s)
              if not m: raise SystemExit("manifest root missing")
              s=s[:m.end()]+'\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'+s[m.end():]
          if "MainActivity$InstallStatusReceiver" not in s:
              s=s.replace("</application>",'        <receiver android:name=".MainActivity$InstallStatusReceiver" android:exported="false"/>\n    </application>',1)
          manifest.write_text(s)
          PY
      - name: Preserve Flutter launch manifest and validate it
        run: |
          cd mobile
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          ET.parse(p)
          s=p.read_text()
          required=['${applicationName}','.MainActivity','@style/LaunchTheme','android.intent.action.MAIN','android.intent.category.LAUNCHER']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("FAIL: Flutter launch manifest missing: "+", ".join(missing))
          print("PASS: preserved Flutter-generated launch manifest.")
          PY

      - name: Verify PackageInstaller updater and launcher
        run: |
          cd mobile
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          main=Path("android/app/src/main/kotlin/com/allways/app/MainActivity.kt").read_text()
          manifest=Path("android/app/src/main/AndroidManifest.xml").read_text()
          ET.parse("android/app/src/main/AndroidManifest.xml")
          required=["PackageInstaller.SessionParams","session.openWrite","session.commit","packageManager.canRequestPackageInstalls()","Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES"]
          missing=[x for x in required if x not in main]
          if "Intent.ACTION_INSTALL_PACKAGE" in main: missing.append("deprecated ACTION_INSTALL_PACKAGE must be absent")
          for x in ["android.permission.REQUEST_INSTALL_PACKAGES","android:name=\".MainActivity\"","android.intent.action.MAIN","android.intent.category.LAUNCHER"]:
              if x not in manifest: missing.append(x)
          if missing: raise SystemExit("FAIL: "+", ".join(missing))
          print("PASS: stable launcher + PackageInstaller updater verified")
          PY

      - name: Configure ALLways Android package and Firebase Google Services
        run: |
          cd mobile
          python - <<'PY'
          from pathlib import Path
          import re

          target_package = "com.allways.app"

          # flutter create --org com.allways.app would otherwise produce
          # com.allways.app.allways_app. ALLways is already registered in
          # Firebase/Google OAuth as com.allways.app, so force the exact ID.
          app = Path("android/app")
          groovy = app / "build.gradle"
          kotlin = app / "build.gradle.kts"
          settings_groovy = Path("android/settings.gradle")
          settings_kotlin = Path("android/settings.gradle.kts")

          if groovy.exists():
              p = groovy
              s = p.read_text()
              s = re.sub(r"namespace\s+['\"][^'\"]+['\"]", 'namespace "' + target_package + '"', s, count=1)
              s = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", 'applicationId "' + target_package + '"', s, count=1)
              p.write_text(s)
          elif kotlin.exists():
              p = kotlin
              s = p.read_text()
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "' + target_package + '"', s, count=1)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "' + target_package + '"', s, count=1)
              p.write_text(s)
          else:
              raise SystemExit("No Android app Gradle file found")

          # Apply the official Google Services Gradle plugin so the checked-in
          # google-services.json is actually processed during the build.
          if settings_groovy.exists():
              p = settings_groovy
              s = p.read_text()
              if 'com.google.gms.google-services' not in s:
                  marker = 'plugins {'
                  s = s.replace(marker, marker + '\n    id "com.google.gms.google-services" version "4.5.0" apply false', 1)
              p.write_text(s)
              app_text = groovy.read_text() if groovy.exists() else ""
              if 'com.google.gms.google-services' not in app_text:
                  app_text = app_text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
                  groovy.write_text(app_text)
          elif settings_kotlin.exists():
              p = settings_kotlin
              s = p.read_text()
              if 'com.google.gms.google-services' not in s:
                  marker = 'plugins {'
                  s = s.replace(marker, marker + '\n    id("com.google.gms.google-services") version "4.5.0" apply false', 1)
              p.write_text(s)
              app_text = kotlin.read_text() if kotlin.exists() else ""
              if 'com.google.gms.google-services' not in app_text:
                  app_text = app_text.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
                  kotlin.write_text(app_text)
          else:
              raise SystemExit("No Android settings Gradle file found")
          PY

          grep -R -n 'applicationId.*com.allways.app' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Verify Firebase configuration
        run: |
          cd mobile
          test -f android/app/google-services.json
          grep -q '"client_type": 1' android/app/google-services.json
          grep -q '"package_name": "com.allways.app"' android/app/google-services.json
          grep -q 'com.allways.app' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null
          grep -q 'com.google.gms.google-services' android/settings.gradle android/settings.gradle.kts 2>/dev/null

      - name: Configure permanent ALLways release signing
        env:
          ALLWAYS_KEYSTORE_BASE64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          ALLWAYS_KEYSTORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          ALLWAYS_KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          test -n "$ALLWAYS_KEYSTORE_BASE64"
          test -n "$ALLWAYS_KEYSTORE_PASSWORD"
          test -n "$ALLWAYS_KEY_PASSWORD"
          cd mobile
          mkdir -p android/keystore
          printf '%s' "$ALLWAYS_KEYSTORE_BASE64" | base64 --decode > android/keystore/allways-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ALLWAYS_KEYSTORE_PASSWORD
          keyPassword=$ALLWAYS_KEY_PASSWORD
          keyAlias=allways
          storeFile=keystore/allways-release.jks
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app")
          groovy = p / "build.gradle"
