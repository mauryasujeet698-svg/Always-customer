          # global AndroidRuntime grep falsely matched the Android Monkey
          # launcher itself (com.android.commands.monkey), even when ALLways
          # had launched successfully.
          app_pid="$(adb shell pidof com.allways.app 2>/dev/null | tr -d '\\r' | tr -d '[:space:]' || true)"
