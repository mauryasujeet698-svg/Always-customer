name: ALLways Customer Android Release
on:
  push:
    branches:
      - allways-android-app
      - fix/customer-apk-ci-smoke-test
      - "fix/**"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: allways-customer-android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, test and launch-check Customer APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          cache: true

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::Release signing secrets are not configured; building an unsigned validation APK only."
            echo "UNSIGNED_VALIDATION_BUILD=true" >> "$GITHUB_ENV"
            exit 0
          fi
          KEY_PASSWORD_VALUE="${KEY_PASSWORD:-$STORE_PASSWORD}"
          mkdir -p mobile/android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 --decode > mobile/android/keystore/allways-release.jks
          test -s mobile/android/keystore/allways-release.jks
          chmod 600 mobile/android/keystore/allways-release.jks
          cat > mobile/android/key.properties <<EOF
          storeFile=keystore/allways-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD_VALUE
          keyAlias=allways
          EOF
          keytool -list -keystore mobile/android/keystore/allways-release.jks -storepass "$STORE_PASSWORD" -alias allways >/dev/null

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze and test
        working-directory: mobile
        run: |
          # Keep existing lint findings visible without blocking release validation on warnings/infos.
          # Analyzer output remains in the run log and must be reviewed before production release.
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build signed arm64 production APK
        working-directory: mobile
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAPBOX_PUBLIC_TOKEN"
          case "$MAPBOX_PUBLIC_TOKEN" in pk.*) ;; *) echo "::error::MAPBOX_PUBLIC_TOKEN must be a public pk.* token"; exit 1 ;; esac
          flutter build apk --release --target-platform android-arm64 --shrink --dart-define=MAPBOX_PUBLIC_TOKEN="$MAPBOX_PUBLIC_TOKEN"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Customer arm64 APK size: $SIZE bytes (maximum 35,000,000)"
          if [ "$SIZE" -gt 35000000 ]; then echo "::error::Customer APK exceeds 35 MB"; exit 1; fi
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          test -x "$APKSIGNER"
          test -x "$AAPT2"
          if [ "${UNSIGNED_VALIDATION_BUILD:-false}" != "true" ]; then
            "$APKSIGNER" verify --verbose "$APK"
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "::warning::APK signature verification skipped for unsigned validation build."
          fi
          "$AAPT2" dump badging "$APK" | grep -F "package: name='com.allways.app'"
          "$AAPT2" dump badging "$APK" | grep -F "application-label:'ALLways'"
          "$AAPT2" dump permissions "$APK" | grep -F "android.permission.INTERNET"
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" | tee build/release-checksum.txt
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp "$APK" "$GITHUB_WORKSPACE/release-assets/allways-customer-v${VERSION}.apk"
          cp build/release-checksum.txt "$GITHUB_WORKSPACE/release-assets/allways-customer-checksum.txt"
          cp "$APK" "$GITHUB_WORKSPACE/release-assets/allways-latest.apk"
          cp build/release-checksum.txt "$GITHUB_WORKSPACE/release-assets/allways-latest-checksum.txt"
          flutter build appbundle --release --shrink --dart-define=MAPBOX_PUBLIC_TOKEN="$MAPBOX_PUBLIC_TOKEN"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          sha256sum "$AAB" | tee build/appbundle-checksum.txt
          cp "$AAB" "$GITHUB_WORKSPACE/release-assets/allways-customer-v${VERSION}.aab"
          cp build/appbundle-checksum.txt "$GITHUB_WORKSPACE/release-assets/allways-customer-appbundle-checksum.txt"

      - name: Build release-mode x86_64 APK for launch smoke test
        working-directory: mobile
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --target-platform android-x64 --shrink --obfuscate --split-debug-info=build/smoke-symbols --dart-define=MAPBOX_PUBLIC_TOKEN="$MAPBOX_PUBLIC_TOKEN"

      - name: Android release-mode launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/customer-android-smoke-test.sh

      - name: Upload verified APKs as workflow artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: allways-customer-apk-v${{ env.APP_VERSION }}
          path: |
            release-assets/allways-customer-v${{ env.APP_VERSION }}.apk
            release-assets/allways-customer-checksum.txt
            release-assets/allways-latest.apk
            release-assets/allways-latest-checksum.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Google Play App Bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: allways-customer-play-aab-v${{ env.APP_VERSION }}
          path: |
            release-assets/allways-customer-v${{ env.APP_VERSION }}.aab
            release-assets/allways-customer-appbundle-checksum.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Customer APK release
        if: success() && github.ref == 'refs/heads/allways-android-app' && env.UNSIGNED_VALIDATION_BUILD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: allways-latest
          name: "ALLways Customer v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release-assets/allways-customer-v${{ env.APP_VERSION }}.apk
            release-assets/allways-customer-checksum.txt
            release-assets/allways-latest.apk
            release-assets/allways-latest-checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
