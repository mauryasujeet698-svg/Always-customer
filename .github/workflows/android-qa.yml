name: ALLways Customer Android QA

on:
  push:
    branches: [migration/flutter-native-customer]
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "android/app/google-services.json"
      - ".github/workflows/android-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allways-customer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.allways --project-name app .

      - name: Configure Firebase, package identity and Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          plugin = 'id("com.google.gms.google-services") version "4.5.0" apply false'
          if plugin not in text:
              text = text.replace("plugins {", "plugins {\n    " + plugin, 1)
          settings.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace("plugins {", 'plugins {\n    id("com.google.gms.google-services")', 1)
          text = re.sub(r'applicationId = "[^"]+"', 'applicationId = "com.allways.app"', text, count=1)
          text = re.sub(r'namespace = "[^"]+"', 'namespace = "com.allways.app"', text, count=1)
          text = re.sub(r'minSdk = [^\n]+', 'minSdk = 24', text, count=1)
          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          for perm in (
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ):
              tag = f'<uses-permission android:name="{perm}"/>'
              if perm not in text:
                  text = text.replace("<application", f"    {tag}\n    <application", 1)
          text = text.replace('android:label="app"', 'android:label="ALLways"')
          manifest.write_text(text)
          PY
          test -f android/app/google-services.json
          grep -q '"package_name": "com.allways.app"' android/app/google-services.json
          grep -q 'applicationId = "com.allways.app"' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: allways-customer-android-qa
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
