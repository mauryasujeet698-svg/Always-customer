name: ALLways Customer Repair QA
on:
  push:
    branches: [fix/reported-flow-audit-2026-10-10]
    paths:
      - "mobile/**"
      - "functions/**"
      - ".github/workflows/repair-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true
      - name: Check Cloud Function JavaScript syntax (no deployment)
        run: node --check functions/index.js
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
        continue-on-error: true
      - name: Tests
        working-directory: mobile
        run: flutter test
        continue-on-error: true
      - name: Build customer QA APK (debug, no release)
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64
      - name: Validate APK size and SHA-256
        working-directory: mobile
        run: |
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk -o -s build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk -o -s build/app/outputs/flutter-apk/app-debug.apk
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*debug.apk' -type f | head -n 1)"
          test -n "$APK"
          stat -c 'APK=%n SIZE_BYTES=%s' "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: allways-customer-repair-qa-apk
          path: mobile/build/app/outputs/flutter-apk/*debug.apk
          if-no-files-found: error
          retention-days: 7
