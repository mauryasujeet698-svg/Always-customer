name: ALLways Customer Repair QA
on:
  push:
    branches: [fix/reported-flow-audit-2026-10-10]
    paths:
      - "mobile/**"
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/repair-qa.yml"
  pull_request:
    branches: [allways-android-app]
    paths:
      - "mobile/**"
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/repair-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allways-customer-repair-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
      - name: Unit and widget tests
        working-directory: mobile
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Dart test files found; compile smoke test remains required."
          fi
      - name: Debug compile smoke test (not a release artifact)
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64
      - name: Validate Cloud Functions source
        run: node --check functions/index.js
      - name: Check patch whitespace
        run: git diff --check
      - name: Upload QA-only debug APK
        uses: actions/upload-artifact@v4
        with:
          name: allways-customer-debug-qa-only
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 1
