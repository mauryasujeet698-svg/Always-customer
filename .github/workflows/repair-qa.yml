name: ALLways Customer Repair QA
on:
  push:
    branches: [fix/reported-flow-audit-2026-10-10]
    paths:
      - "mobile/**"
      - "functions/**"
      - ".github/workflows/repair-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 100
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install or reuse Flutter SDK
        run: |
          $toolRoot = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { $env:RUNNER_TEMP }
          $installRoot = Join-Path $toolRoot "allways-flutter-3.35.2"
          $flutterBin = Join-Path $installRoot "flutter\bin"
          $flutterExe = Join-Path $flutterBin "flutter.bat"
          if (!(Test-Path $flutterExe)) {
            $archive = Join-Path $env:RUNNER_TEMP "flutter_windows_3.35.2-stable.zip"
            $extractRoot = Join-Path $env:RUNNER_TEMP "allways-flutter-extract"
            if (Test-Path $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
            Invoke-WebRequest -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.35.2-stable.zip" -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
            if (!(Test-Path (Join-Path $extractRoot "flutter\bin\flutter.bat"))) { throw "Flutter SDK archive did not contain flutter\bin\flutter.bat." }
            New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
            Copy-Item -Path (Join-Path $extractRoot "flutter") -Destination $installRoot -Recurse -Force
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
          $env:PATH = "$flutterBin;$env:PATH"
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) { throw "Flutter SDK setup failed." }
      - uses: android-actions/setup-android@v4
      - name: Install required Android SDK platform and build tools
        run: |
          $sdkManager = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if ($null -eq $sdkManager) { $sdkManager = Get-Command sdkmanager -ErrorAction SilentlyContinue }
          if ($null -eq $sdkManager) { throw "Android sdkmanager was not found after setup-android." }
          & $sdkManager.Source "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed with exit code $LASTEXITCODE" }
          flutter doctor --android-licenses
          if ($LASTEXITCODE -ne 0) { throw "Android SDK licenses could not be accepted" }
      - name: Install and smoke-test Cloud Functions source (no deployment)
        run: |
          npm install --prefix functions --no-package-lock --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "Cloud Functions dependency installation failed." }
          node --check functions/index.js
          if ($LASTEXITCODE -ne 0) { throw "Cloud Functions source syntax check failed." }
          $env:GCLOUD_PROJECT = "allways-repair-smoke"
          $env:FIREBASE_CONFIG = '{"projectId":"allways-repair-smoke"}'
          node -e "require('./functions/index.js'); console.log('Cloud Functions module loaded successfully')"
          if ($LASTEXITCODE -ne 0) { throw "Cloud Functions module failed to load." }
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
      - name: Tests
        working-directory: mobile
        run: flutter test
      - name: Build Customer QA APK (debug only, no release publish)
        working-directory: mobile
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --debug --target-platform android-arm64 "--dart-define=MAPBOX_PUBLIC_TOKEN=$env:MAPBOX_PUBLIC_TOKEN"
      - name: Validate APK size and SHA-256
        working-directory: mobile
        run: |
          $apkDir = Join-Path $PWD "build/app/outputs/flutter-apk"
          $apk = Get-ChildItem -Path $apkDir -Filter "*debug.apk" -File | Select-Object -First 1
          if ($null -eq $apk) { throw "Flutter did not produce a debug APK" }
          Write-Output "APK=$($apk.FullName) SIZE_BYTES=$($apk.Length)"
          Get-FileHash -Path $apk.FullName -Algorithm SHA256
          if ($apk.Length -gt 30MB) { Write-Warning "This is a debug QA APK, not the optimized release APK; release size must be checked separately." }
      - uses: actions/upload-artifact@v4
        with:
          name: allways-customer-repair-qa-apk
          path: mobile/build/app/outputs/flutter-apk/*debug.apk
          if-no-files-found: error
          retention-days: 7
