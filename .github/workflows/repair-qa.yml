name: ALLways Customer Repair QA
on:
  push:
    branches: [fix/reported-flow-audit-2026-10-10]
    paths:
      - "mobile/**"
      - "functions/**"
      - ".github/workflows/repair-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | flutter doctor --android-licenses
      - name: Install and smoke-test Cloud Functions source (no deployment)
        run: |
          npm install --prefix functions --no-package-lock --ignore-scripts
          node --check functions/index.js
          GCLOUD_PROJECT=allways-repair-smoke FIREBASE_CONFIG='{"projectId":"allways-repair-smoke"}' node -e "require('./functions/index.js'); console.log('Cloud Functions module loaded successfully')"
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
      - name: Tests
        working-directory: mobile
        run: flutter test
      - name: Build Customer QA APK (debug only, no release publish)
        working-directory: mobile
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --debug --target-platform android-arm64 "--dart-define=MAPBOX_PUBLIC_TOKEN=$MAPBOX_PUBLIC_TOKEN"
      - name: Validate APK size and SHA-256
        working-directory: mobile
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk"
          test -s "$APK" || APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          stat -c 'APK=%n SIZE_BYTES=%s' "$APK"
          sha256sum "$APK"
          if [ "$(stat -c%s "$APK")" -gt 30000000 ]; then
            echo "Debug APK exceeds 30 MB; this is diagnostic only. Release build has a separate 30 MB gate."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: allways-customer-repair-qa-apk
          path: mobile/build/app/outputs/flutter-apk/*debug.apk
          if-no-files-found: error
          retention-days: 7
