name: ALLways Customer Repair QA
on:
  push:
    branches: [fix/reported-flow-audit-2026-10-10]
    paths:
      - "mobile/**"
      - "functions/**"
      - ".github/workflows/repair-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Add Git for Windows Bash to PATH
        run: |
          $gitCommand = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitCommand -Parent) -Parent
          $bashDirectory = Join-Path $gitRoot "bin"
          $bashExe = Join-Path $bashDirectory "bash.exe"
          if (!(Test-Path $bashExe)) { throw "Git Bash was not found at $bashExe. Install Git for Windows with Bash enabled." }
          Add-Content -Path $env:GITHUB_PATH -Value $bashDirectory
          $env:PATH = "$bashDirectory;$env:PATH"
          & $bashExe --version
      - name: Set up Flutter on the self-hosted Windows runner
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: false
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install required Android SDK platform and build tools
        run: |
          $packages = @("platform-tools", "platforms;android-35", "build-tools;35.0.0")
          & sdkmanager.bat @packages
          if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed with exit code $LASTEXITCODE" }
          & flutter doctor --android-licenses
          if ($LASTEXITCODE -ne 0) { throw "Android SDK licenses could not be accepted" }
      - name: Check Cloud Function source syntax (no deployment)
        run: node --check functions/index.js
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
        continue-on-error: true
      - name: Tests
        working-directory: mobile
        run: flutter test
        continue-on-error: true
      - name: Supply placeholder signing properties for debug-only build
        working-directory: mobile/android
        run: |
          @(
            "keyAlias=qa"
            "keyPassword=qa"
            "storeFile=qa-debug-not-used.jks"
            "storePassword=qa"
          ) | Set-Content -Path key.properties -Encoding ascii
      - name: Build Customer QA APK (debug only, no release publish)
        working-directory: mobile
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --debug --target-platform android-arm64 "--dart-define=MAPBOX_PUBLIC_TOKEN=$env:MAPBOX_PUBLIC_TOKEN"
      - name: Validate APK size and SHA-256
        shell: powershell
        working-directory: mobile
        run: |
          $apkDir = Join-Path $PWD "build/app/outputs/flutter-apk"
          $apk = Get-ChildItem -Path $apkDir -Filter "*debug.apk" -File | Select-Object -First 1
          if ($null -eq $apk) { throw "Flutter did not produce a debug APK" }
          if ($apk.Length -gt 30MB) { Write-Warning "QA APK is larger than the 30 MB target: $($apk.Length) bytes" }
          Write-Output "APK=$($apk.FullName) SIZE_BYTES=$($apk.Length)"
          Get-FileHash -Path $apk.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: allways-customer-repair-qa-apk
          path: mobile/build/app/outputs/flutter-apk/*debug.apk
          if-no-files-found: error
          retention-days: 7
