name: TEMP ALLways Analyzer

on:
  push:
    branches:
      - allways-android-app
    paths:
      - "mobile/lib/main.dart"
      - ".github/workflows/temp-analyze.yml"

permissions:
  contents: read
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true
      - name: Analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd mobile
          flutter pub get
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/allways-analyze.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            gh issue create --title "TEMP analyzer diagnostics run $GITHUB_RUN_NUMBER" --body-file /tmp/allways-analyze.log || true
            exit "$status"
          fi
