name: ALLways Firestore Rules QA

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "functions/**"
      - "tests/firestore.rules.test.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firestore-rules-qa.yml"
  push:
    branches: [security/firestore-rbac-phone-checkout]
    paths:
      - "firestore.rules"
      - "functions/**"
      - "tests/firestore.rules.test.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firestore-rules-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allways-firestore-rules-qa-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install QA dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: node --check functions/index.js && node --check functions/partner_functions.js && node --check functions/scripts/set-admin-claim.js

      - name: Run Firestore emulator rules tests
        run: npm run test:rules
