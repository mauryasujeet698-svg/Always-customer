name: Deploy ALLways Firebase Functions

on:
  # Cloud Functions deployment is intentionally manual while allways-web is on Firebase Spark.
  # When Blaze is enabled, run this workflow manually to activate server-side automation.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Test Cloud Functions helpers
        working-directory: functions
        run: npm test

      - name: Validate production geocoding provider
        env:
          GEOCODING_API_BASE_URL: ${{ vars.GEOCODING_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GEOCODING_API_BASE_URL:-}" ]]; then
            echo "::error::Set the repository Actions variable GEOCODING_API_BASE_URL to an owned or contracted HTTPS geocoder endpoint before deploying Functions."
            exit 1
          fi
          case "$GEOCODING_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::GEOCODING_API_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          printf 'GEOCODING_API_BASE_URL=%s\n' "$GEOCODING_API_BASE_URL" > functions/.env
          chmod 600 functions/.env

      - name: Verify Firebase deployment credential is available
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Firebase deployment credential: FIREBASE_TOKEN"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Firebase deployment credential: FIREBASE_SERVICE_ACCOUNT_JSON"
          else
            echo "ERROR: neither FIREBASE_TOKEN nor FIREBASE_SERVICE_ACCOUNT_JSON is configured."
            exit 1
          fi

      - name: Deploy Cloud Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only functions --project allways-web --token "$FIREBASE_TOKEN"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            firebase deploy --only functions --project allways-web
          else
            echo "Add FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_JSON to GitHub repository secrets."
            exit 1
          fi
