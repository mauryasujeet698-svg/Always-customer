<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ALLways Admin</title><link rel="stylesheet" href="styles.css">
</head><body>
<header class="topbar"><div class="brand"><span class="pin">●</span> ALLways Admin</div><a class="ghost" href="index.html">← Store</a></header>
<main>
<section class="hero"><div><span class="pill">ADMIN</span><h1>Orders & operations</h1><p>Live order dashboard for ALLways.</p></div><div class="hero-art">📦</div></section>
<div id="adminAuth" class="empty">Checking admin access…</div>
<section id="dashboard" class="hidden">
<div class="admin-toolbar"><button class="primary smallBtn" id="notifyBtn">🔔 Enable notifications</button><button class="secondary smallBtn" id="refreshBtn">↻ Refresh</button><button class="secondary smallBtn" id="syncCatalogBtn">↻ Sync catalog</button></div><p id="catalogSyncMsg" class="muted"></p>
<div id="summary" class="admin-summary"></div>
<div class="section-head"><h2>Orders</h2><span id="orderCount"></span></div>
<div id="orders" class="admin-orders"></div>
<div class="section-head"><h2>Privacy requests & grievances</h2><span id="privacyRequestCount">0</span></div>
<div id="privacyRequests" class="admin-orders"><div class="empty">Loading privacy requests…</div></div>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="admin.js"></script>
</body></html>
